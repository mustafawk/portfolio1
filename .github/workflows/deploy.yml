name: Portfolio CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: portfolio/package-lock.json
    - name: Install dependencies
      run: cd portfolio && npm ci
    - name: Build
      run: cd portfolio && npm run build
    - name: Lint
      run: cd portfolio && npm run lint
